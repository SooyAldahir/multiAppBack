# Render Blueprint de MultiApp (API) — repositorio SooyAldahir/multiAppBack.
# Los valores marcados con sync: false se capturan en el panel de Render (no van en git).
services:
  - type: web
    name: multiapp-api
    runtime: node
    plan: free
    region: virginia          # misma zona que Azure "East US" → menos latencia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true   # Render genera un secreto largo y aleatorio
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      # ---- Azure SQL ----
      - key: DB_SERVER
        sync: false           # ej. multiapp-sql.database.windows.net
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        sync: false           # ej. multiapp
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: "false"
      # ---- IA (Groq) ----
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_VISION_MODEL
        value: qwen/qwen3.8-27b
      # ---- Fotos de perfil (Cloudinary) ----
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: multiapp
      # ---- Push (Firebase): sube el JSON como "Secret File" con este nombre ----
      - key: FIREBASE_SERVICE_ACCOUNT
        value: /etc/secrets/firebase-service-account.json
      # ---- Mapas ----
      - key: GEO_COUNTRY_CODES
        value: mx
      - key: GEO_CONTACT_EMAIL
        sync: false
      # ---- Crea las tablas nuevas al arrancar (idempotente) ----
      - key: AUTO_MIGRATE
        value: "true"
      # ---- Iniciar sesión con Google / Apple ----
      - key: GOOGLE_CLIENT_IDS
        sync: false           # "Web client ID" de Google (termina en .apps.googleusercontent.com)
      - key: APPLE_CLIENT_IDS
        value: com.aldahirballina.multiapp
      - key: APPLE_TEAM_ID
        value: BR8MSB248A
      - key: APPLE_KEY_ID
        sync: false           # ID de la llave "Sign in with Apple" (.p8)
      - key: APPLE_PRIVATE_KEY_PATH
        value: /etc/secrets/apple-signin-key.p8
      # ---- Páginas legales (/privacidad, /terminos, /eliminar-cuenta, /soporte) ----
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_CITY
        sync: false
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false           # huella SHA-256 del certificado de firma (Play Console → Integridad de la app)
